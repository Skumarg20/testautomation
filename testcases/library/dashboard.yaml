- id: TC_DASH_012
  module: dashboard
  title: 'Net Sale equals the Sale Register total for the same range (MB-024396, #0bf8d367, #58aa7aec). NEEDS DECISION:
    Net Sale is net of GST,...'
  priority: p2
  tags:
  - imported
  - unverified
  - trade:all
  - passed
  destructive: false
  draft: false
  preconditions:
  - 'Source: ai-projects e2e/scenarios/dashboard.md DB-12'
  - 'Scenario: Net Sale equals the Sale Register total for the same range (MB-024396, #0bf8d367, #58aa7aec). NEEDS
    DECISION: Net Sale is net of GST, the register includes it (see spec).'
  expected:
  - After Refresh Dashboard, Net Sale (Last 30 Days) equals the Sales - Register(All) net (Credit - Debit) for the
    same period; both are without GST (taxable value)
  steps:
  - action: use_company
    value: QA GST Billing General
  - action: press
    value: Alt+h
  - action: sleep
    value: 4
  - action: click
    target: xpath=//*[@role="tab" or contains(@class,"nav-link")][normalize-space()="Dashboard"]
    note: Dashboard tab
  - action: sleep
    value: 4
  - action: click
    target: xpath=//button[@title="Refresh Dashboard"]
    note: Refresh Dashboard (otherwise it shows the last sync)
  - action: sleep
    value: 15
  - action: assert_text
    value: 'Last Sync : {today}'
    note: Synced today
  - action: assert_visible
    target: xpath=//*[normalize-space()="Last 30 Days"]
    note: 'Range: Last 30 Days'
  - action: read_value
    target: xpath=//div[contains(@class,"nd-chart")][.//div[contains(@class,"title")][normalize-space(text())="Net
      Sale"]]//h4
    save_as: ns
    note: 'Net Sale: ₹<value> from ₹<previous period>'
  - action: screenshot
    value: TC_DASH_012_dash
  - action: press
    value: Alt+h
  - action: sleep
    value: 3
  - action: hover
    target: '#lft-dropdown'
    note: Mouse over the side menu
  - action: sleep
    value: 1
  - action: fill
    target: input[placeholder="Type to search"]
    value: Register
    note: 'Menu search: Register'
    inside_modal: true
  - action: sleep
    value: 2
  - action: click
    target: xpath=//p[normalize-space()="Inventory Report / Sales Reports / Sales - Register(All)"]
    note: Open Inventory Report / Sales Reports / Sales - Register(All)
    inside_modal: true
  - action: wait_text
    value: Monthly Balance
  - action: sleep
    value: 3
  - action: assert_visible
    target: xpath=//div[@role="row"][.//div[@col-id="Month"][normalize-space()="October"]]//div[@col-id="Credit"][normalize-space()=""]
    note: No October sales (so Last 30 Days = November here)
  - action: assert_visible
    target: xpath=//div[@role="row"][.//div[@col-id="Month"][normalize-space()="November"]]//div[@col-id="Monthly"][starts-with(translate(normalize-space(.),",",""),
      concat(substring-before(substring-after("{ctx.ns}","₹")," from"), " "))]
    note: Register November net (taxable, without GST) = dashboard Net Sale
  - action: screenshot
    value: TC_DASH_012
  - action: press
    value: Alt+h
  - action: sleep
    value: 2
  verification:
    status: verified
    company: QA GST Billing General
    date: '2026-11-20'
    run:
      passed: 25
      total: 25
    evidence:
    - artifacts/run_2026-11-19_22-52-08/TC_DASH_012.png
    kb:
    - support:MB-24396
    notes: 'The dashboard shows stale figures until ''Refresh Dashboard'' is clicked (Last Sync was 16-10-2026,
      Net Sale 0.00); after refresh: Net Sale 103049.99 (Last 30 Days). Inventory Report > Sales Reports > Sales
      - Register(All): November Credit 1,03,049.99, Monthly 1,03,049.99 Cr, October empty. Both are the taxable
      value without GST (B2B 2400.00 + B2C 599.99 + exempt 100050.00 = GSTR-1 HSN total), so the ''NEEDS DECISION''
      note (register includes GST) does not apply: this register is the sales account, net of GST. The steps compare
      the read Net Sale with November and assert October is empty (the 30-day window here).'
