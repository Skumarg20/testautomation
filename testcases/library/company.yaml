- id: TC_COMP_015
  module: company
  title: Usage figures (users, GSTIN, e-invoice, SMS ...) are shown as used / total. UNVERIFIED format.
  priority: p2
  tags:
  - imported
  - trade:all
  - passed
  destructive: false
  draft: false
  preconditions:
  - 'Source: ai-projects e2e/scenarios/subscription-status.md SS-07'
  expected:
  - Add-ons Stats show each add-on (Users, Invoice, Organisation, GSTIN, WhatsApp...) as two figures a/b under a
    donut; the second figure is the used count (Users 29/2 with 2 users)
  steps:
  - action: use_company
    value: QA GST Computer Hardware
  - action: press
    value: Alt+h
  - action: sleep
    value: 3
  - action: click
    target: '#aControlRoomSetting'
    note: Settings (Dashboard Setting)
  - action: wait_text
    value: Dashboard Setting
  - action: click
    target: xpath=//*[normalize-space(text())="Manage subscription and plan"]/following::button[normalize-space()="Configure"][1]
    inside_modal: true
    note: Manage subscription and plan > Configure
  - action: wait_text
    value: Add-ons Stats
  - action: sleep
    value: 3
  - action: assert_visible
    target: xpath=//*[normalize-space()="Users"]/following::*[contains(normalize-space(text()),"/")][1]
    note: 'Add-ons Stats: Users shows two figures ''a/b'''
  - action: assert_visible
    target: xpath=//*[normalize-space()="Invoice"]/following::*[contains(normalize-space(text()),"/")][1]
    note: 'Add-ons Stats: Invoice shows two figures ''a/b'''
  - action: assert_visible
    target: xpath=//*[normalize-space()="Organisation"]/following::*[contains(normalize-space(text()),"/")][1]
    note: 'Add-ons Stats: Organisation shows two figures ''a/b'''
  - action: assert_visible
    target: xpath=//*[normalize-space()="GSTIN"]/following::*[contains(normalize-space(text()),"/")][1]
    note: 'Add-ons Stats: GSTIN shows two figures ''a/b'''
  - action: screenshot
    value: TC_COMP_015
  - action: press
    value: Alt+h
  - action: sleep
    value: 2
  verification:
    status: corrected
    company: QA GST Computer Hardware
    date: '2026-11-19'
    run:
      passed: 15
      total: 15
    evidence:
    - artifacts/run_2026-11-18_23-25-22/TC_COMP_015.png
    kb:
    - onedrive:SUBSCRIPTION/Subscription & Plan_v1.2.docx#1.4
    notes: 'Settings > Manage subscription and plan > Configure (My Current Plan, Enterprise): Add-ons Stats show
      each add-on as two figures ''a/b'': Users 29/2, Invoice 1949413/468, Organisation 1/34, GSTIN 20/0, WhatsApp
      Credits 1931/69. The order is not used/total: with 2 users the Users figure reads 29/2, so the first number
      is what is left and the second what is used (the design doc shows a donut with the total in the centre and
      a two-number label). The steps check that the figures are there, not their values.'
