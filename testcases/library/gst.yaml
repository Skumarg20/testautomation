  - action: wait_text
    value: Item List
  - action: click
    target: xpath=//a[contains(@class,"menulink")][@title="Reports"]
    note: 'Side menu: Report'
  - action: click_text
    value: Statutory Report
    note: Statutory Report tab
  - action: click_text
    value: E-Invoice
    exact: true
    note: Open E-Invoice
  - action: wait_text
    value: E-Invoice Summary
  - action: select
    target: '#txtdateType'
    value: This Year
    note: Period This Year
  - action: select
    target: '#txtDatadropdown'
    value: All
    note: Status All
  - action: click
    target: '#b2b'
    note: Tick B2B
  - action: click
    target: '#cdnr'
    note: Tick CDNR
  - action: click
    target: '#submit'
    note: Submit
  - action: sleep
    value: 4
  - action: assert_text
    value: Name of the Customer
  - action: assert_text
    value: GSTIN
  - action: assert_text
    value: Tax Type
  - action: assert_text
    value: Invoice Date
  - action: assert_text
    value: Invoice No
  - action: assert_text
    value: Bill Amount
  - action: assert_text
    value: Taxable Value
  - action: assert_text
    value: Tax Amount
