- id: TC_CACC_031
  module: reports
  title: Sale Register taxable value equals GSTR-1 total taxable value for the same month
  priority: p1
  tags:
  - trade:all
  - reports
  - gst
  - reconcile
  - passed
  destructive: false
  draft: false
  preconditions:
  - 'Manual steps: Sale Register for a month; GSTR-1 for the same month'
  - 'KB: support:cluster:gst_einvoice:gstr:2 (GSTR-1 and sale register taxable value mismatch complaints)'
  expected:
  - Taxable value in the Sale Register equals the sum of taxable sales across GSTR-1 B2B + B2C sections (minus credit
    notes when the register excludes them)
  steps:
  - action: use_company
    value: QA GST Computer Hardware
  - action: press
    value: Alt+h
  - action: sleep
    value: 3
  - action: press
    value: Alt+i
    note: Item list (a screen with the side menu)
  - action: wait_text
    value: Item List
  - action: click
    target: xpath=//a[contains(@class,"menulink")][@title="Reports"]
    note: 'Side menu: Report'
  - action: click_text
    value: Statutory Report
  - action: click_text
    value: GSTR-1
    note: Statutory Report > GSTR-1 (opens on the previous month)
  - action: wait_text
    value: B2C(Small)
  - action: sleep
    value: 2
  - action: press
    value: Alt+d
    note: 'Alt+D: date filter (offers the current month)'
  - action: wait_text
    value: Date Filter
  - action: click_text
    value: Ok
    inside_modal: true
  - action: sleep
    value: 4
  - action: sleep
    value: 1
  - action: read_value
    target: xpath=//div[@role="row"][.//div[@col-id="Particulars"][contains(.,"Taxable")]]//div[@col-id="TaxableValue"]
    save_as: b2b
    note: B2B taxable
  - action: read_value
    target: xpath=//div[@role="row"][.//div[@col-id="Particulars"][contains(.,"B2C(Small)")]]//div[@col-id="TaxableValue"]
    save_as: b2cs
    note: B2C(Small) taxable
  - action: read_value
    target: xpath=//div[@role="row"][.//div[@col-id="Particulars"][contains(.,"B2C(Large)")]]//div[@col-id="TaxableValue"]
    save_as: b2cl
    note: B2C(Large) taxable
  - action: read_value
    target: xpath=//div[@role="row"][.//div[@col-id="Particulars"][contains(.,"Unregistered")]]//div[@col-id="TaxableValue"]
    save_as: cdnur
    note: Credit notes (unregistered) taxable
  - action: read_value
    target: xpath=//div[@role="row"][.//div[@col-id="Particulars"][contains(.,"HSN/SAC")]]//div[@col-id="TaxableValue"]
    save_as: hsn
    note: HSN/SAC Summary taxable = B2B + B2C - credit notes
  - action: assert_visible
    target: xpath=//div[@role="row"][.//div[@col-id="Particulars"][contains(.,"Notes(Registered)")]]//div[@col-id="TaxableValue"][normalize-space()="0.00"]
