- id: TC_CPUR_207
  module: reports
  title: Purchase Tax Register shows tax paid per purchase for ITC checks
  priority: p2
  tags:
  - trade:all
  - reports
  - gst
  - passed
  destructive: false
  draft: false
  preconditions:
  - 'Data: purchases at 5% and 18%'
  - 'Manual steps: Report -> Purchase Tax Register -> period'
  - 'KB: careportal:308369#0'
  - 'Data: purchase QAM1 (5%, 12%, 18%, exempt, nil items) dated today'
  expected:
  - Each purchase lists date, supplier, taxable value and tax; totals equal the bills' tax
  steps:
  - action: use_company
    value: QA GST Mobile Trade
  - action: press
    value: Alt+I
    note: Item list (any screen with the side menu open)
  - action: wait_text
    value: Item List
  - action: click
    target: xpath=//a[contains(@class,"menulink")][@title="Reports"]
    note: 'Side menu: Report'
  - action: click_text
    value: Statutory Report
    note: Statutory Report tab
  - action: click_text
    value: GST Tax Register
    exact: true
    note: Open GST Tax Register
  - action: wait_text
    value: GST Tax Register
  - action: click
    target: xpath=//ngb-modal-window//button[normalize-space()='Purchase']
    inside_modal: true
    note: Purchase
  - action: wait_text
    value: Purchase GST Register
  - action: press
    value: Alt+D
    note: Period (Alt+D)
  - action: wait_text
    value: Date Filter
  - action: fill
    target: input#fromDateFilter
    value: '{today}'
    inside_modal: true
  - action: fill
    target: input#toDateFilter
    value: '{today}'
    inside_modal: true
  - action: click
    target: '#btn-Ok'
    inside_modal: true
    note: Period = today
  - action: sleep
    value: 3
  - action: assert_visible
    target: xpath=//div[contains(@class,"ag-row")][@row-index="0"]//div[@col-id][normalize-space()="QA_Supplier_Reg"]
    note: Supplier
  - action: assert_visible
    target: xpath=//div[contains(@class,"ag-row")][@row-index="0"]//div[@col-id][normalize-space()="09AAACQ1234A1Z2"]
    note: Supplier GSTIN
  - action: assert_visible
    target: xpath=//div[contains(@class,"ag-row")][@row-index="0"]//div[@col-id][normalize-space()="QAM1"]
    note: Invoice number QAM1
  - action: assert_visible
    target: xpath=//div[contains(@class,"ag-row")][@row-index="0"]//div[@col-id][normalize-space()="21400.00"]
    note: Invoice value 21,400.00
  - action: screenshot
    value: TC_CPUR_207
  verification:
    status: verified
    company: QA GST Mobile Trade
    date: '2026-11-18'
    run:
      passed: 20
      total: 20
    evidence:
