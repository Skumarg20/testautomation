- id: TC_CSAL_001
  module: sales
  title: New sale bill date different from today shows 'Date is not matching with your Computer Date'
  priority: p3
  tags:
  - trade:all
  - validation
  - date
  - passed
  destructive: true
  draft: false
  preconditions:
  - 'Settings: Control Room > Sale BackDate Billing = Yes (so the date itself is allowed)'
  - 'Manual steps: Sale > Bill > Create (F2) -> change bill date to yesterday -> press Enter on the date'
  - 'KB: sales-purchase/13-configuration-and-number-series.md 2.2 (global.ts:19041, S:1912-1914)'
  expected:
  - Message Date Is Not Matching With Your Computer Date is shown (toast) on Enter in the date of a new bill
  - 'Focus continues to the next field (Party: Select Party window opens); the back date is kept; nothing is saved'
  steps:
  - action: use_company
    value: QA Mobile Trade
  - action: set_setting
    value: Sale BackDate Billing = Yes
    note: Back-dated sale bills allowed (was No)
  - action: goto
    target: /dashboard
    note: Reload the app on the dashboard (the preferences popup then shows on the first new bill)
  - action: wait_text
    value: Net Sale
  - action: open_screen
    target: sale_bill
  - action: sleep
    value: '4'
    note: 'New bill opens with a popup: Select Party, or ''Select Unsaved Bills'' when an earlier bill was left
      unsaved'
  - action: press
    value: Escape
    note: Close whichever popup is open
  - action: sleep
    value: '1'
  - action: click
    target: xpath=//input[contains(@class,"mydate")]
    note: Bill Date field
  - action: press
    value: Control+a
  - action: fill
    target: xpath=//input[contains(@class,"mydate")]
    value: '{today-1}'
    note: Change the date to yesterday
  - action: press
    value: Enter
    note: Enter on the date
  - action: wait_text
    value: Date Is Not Matching With Your Computer Date
    note: Message (toast) 'Date Is Not Matching With Your Computer Date' (new bill)
  - action: wait_text
    value: Select Party
    note: 'Focus continues: the next field (Party) opens its Select Party window'
  - action: screenshot
    value: TC_CSAL_001
  - action: press
    value: Escape
    note: Close Select Party
  - action: sleep
    value: '1.5'
  - action: assert_value
    target: xpath=//input[contains(@class,"mydate")]
    value: '{today-1}'
    note: The back date is kept (Sale BackDate Billing = Yes)
  - action: close_form
    note: Close without saving
  - action: set_setting
    value: Sale BackDate Billing = No
    note: Back to No (as found)
  verification:
    status: verified
    company: QA Mobile Trade
    date: '2026-11-18'
    run:
      passed: 20
      total: 20
    evidence:
    - artifacts/run_2026-11-18_19-21-34/TC_CSAL_001.png
    kb: []
    notes: With Sale BackDate Billing = Yes (set in the steps, back to No at the end), changing a new bill's date
      to {today-1} and pressing Enter shows the message 'Date Is Not Matching With Your Computer Date' as a toast
      (not a popup needing OK); focus moves on to Party (Select Party opens) and the back date stays in the field;
      nothing saved.
- id: TC_CSAL_002
  module: sales
  title: Bill date outside the financial year is rejected ('Date is not matching with Financial Year!')
  priority: p2
  tags:
  - trade:all
  - validation
  - date
  - boundary
  - passed
  destructive: true
  draft: false
  preconditions:
  - 'Data: company financial year known (e.g. 01-04-2026 to 31-03-2027)'
  - 'Manual steps: Sale > Bill > Create -> type a date one day after the FY end -> Enter'
  - 'KB: sales-purchase/13-configuration-and-number-series.md 2.2 (global.ts:19045, date picker min/max = FY dates)'
  - 'Settings: Sale Future Date Billing = Yes during the case (No in this company; set and put back by the steps)'
  expected:
  - With Sale Future Date Billing = Yes, a bill date after the FY end shows Invalid Entry Date ! Date Should Be
    Between Financial Year. and the bill is not saved
  - The date picker min/max are the FY dates (01-04-2026 .. 31-03-2027)
  - With Future/Back Date Billing = No, Future Date Billing Not Allowed / Back Date Billing Not Allowed is shown
    first
  steps:
  - action: use_company
    value: QA Computer Hardware
  - action: set_setting
    value: Sale Future Date Billing = Yes
    note: Allow future dates so that only the financial-year check can stop 01-04-2027 (with No, 'Future Date Billing
      Not Allowed' comes first)
  - action: press
    value: Alt+n
    note: 'Shortcut Alt+N: new Sale Bill'
  - action: sleep
    value: 4
    note: Let the new bill finish loading (it opens Set Transaction Preferences and/or Select Party)
  - action: expect_field
    value: party
    note: Closes the opening popups; the bill has a Party field
  - action: click
    target: '[formcontrolname="ledgerName"]'
    note: Open the party list
  - action: wait_text
    value: Select Party
  - action: click_text
    value: QA_Party_Debtor
    inside_modal: true
    note: Pick QA_Party_Debtor
  - action: press
    value: Enter
  - action: sleep
    value: 3
    note: Cursor moves to the first Product cell (the item list may open by itself)
  - action: assert_visible
    target: xpath=//*[contains(normalize-space(text()),"01-04-2026 to 31-03-2027")]
    note: Company financial year 01-04-2026 to 31-03-2027 (header)
  - action: assert_visible
    target: xpath=//input[contains(@class,"mydate")][@min="2026-04-01"][@max="2027-03-31"]
    note: Date picker limited to the financial year (min/max)
  - action: click
    target: xpath=//input[contains(@class,"mydate")]
    note: Bill Date
  - action: sleep
    value: 1
  - action: press
    value: Control+a
  - action: fill
    target: xpath=//input[contains(@class,"mydate")]
    value: 01-04-2027
    note: Type the day after the FY end
  - action: press
    value: Enter
    target: xpath=//input[contains(@class,"mydate")]
  - action: sleep
    value: 1
  - action: wait_text
    value: Date Should Be Between Financial Year
    note: '''Invalid Entry Date ! Date Should Be Between Financial Year.'''
  - action: screenshot
    value: TC_CSAL_002
  - action: sleep
    value: 8
    note: Let the message go
  - action: press
    value: F10
    note: Try to save
  - action: sleep
    value: 2
  - action: screenshot
    value: TC_CSAL_002_save
  - action: assert_not_visible
    target: xpath=//*[normalize-space()="Select Format"]
    note: Nothing is saved (no print window)
  - action: press
    value: Alt+H
    always: true
  - action: click
    target: '#btnYes'
    inside_modal: true
    optional: true
    always: true
  - action: sleep
    value: 3
    always: true
  - action: set_setting
    value: Sale Future Date Billing = No
    note: Put it back (as found)
    always: true
  - action: assert_setting
    value: Sale Future Date Billing = No
    always: true
  verification:
    status: corrected
    company: QA Computer Hardware
    date: '2026-11-19'
    run:
      passed: 30
      total: 30
    evidence:
    - artifacts/verify/shots/8807_TC_CSAL_002.png
    - artifacts/verify/shots/8807_TC_CSAL_002_save.png
    - artifacts/verify/shots/8807_TC_CSAL_002b.png
    kb:
    - codekb:md:newmarg-webangular20:.claude/docs/shared-module/components-c-date-and-time.md#6-datefiltertemplate-datefilter-1-076-lines
    - codekb:md:newmarg-webangular20:.claude/docs/sales-purchase/13-configuration-and-number-series.md#2-2-back-date-and-future-date-billing-m1-m13-part-3
    notes: 'The date picker is limited to the FY (min 2026-04-01, max 2027-03-31) but a typed 01-04-2027 is accepted
      into the box; on Enter the app shows ''Invalid Entry Date ! Date Should Be Between Financial Year.'' (KB message
      InvalidFinancial), not ''Date is not matching with Financial Year!''. F10 then saves nothing. This needs Sale
      Future Date Billing = Yes: with No (this company''s value) ''Future Date Billing Not Allowed'' comes first,
      and a date before the FY start gives ''Back Date Billing Not Allowed'' (Sale BackDate Billing = No) - KB 13
      2.2 lists those checks. The steps set Future Date Billing Yes and put it back to No (clean-up steps always:
      true). Balance shows ''NaN Dr'' once an out-of-FY date is typed (cosmetic).'
