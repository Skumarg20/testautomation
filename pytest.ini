[pytest]
testpaths = tests
norecursedirs = tests/unit
addopts = -ra -q --html=artifacts/report.html --self-contained-html
markers =
    offline: browser ke bina chalne wale framework tests
    smoke: critical path, ~5 min suite
    regression: full suite
    masters: item/party/ledger masters
    sales: sale invoice, sale return
    purchase: purchase entry, purchase return
    inventory: stock, batch, expiry, barcode
    gst: GSTR reports, e-invoice, e-way bill
    p1: blocker priority
    p2: major priority
    p3: minor priority
    destructive: writes/deletes data - never run on live
